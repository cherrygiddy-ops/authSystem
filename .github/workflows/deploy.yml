name: Deploy AuthService

on:
  push:
    branches: [ "main" ]   # adjust if your default branch is different

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u cherrygiddy-ops --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/cherrygiddy-ops/hotelpos_authservice:latest .

      - name: Push Docker image
        run: docker push ghcr.io/cherrygiddy-ops/hotelpos_authservice:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u cherrygiddy-ops --password-stdin

            # Move into deployment repo where docker-compose.yml lives
            cd /app/hotelpos-deployment
            git pull origin main

            # Write Postgres + JWT secrets into .env
            echo "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" > .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "DB_URL=${{ secrets.DB_URL }}" >> .env

            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}" >> .env
            echo "JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}" >> .env

            # Redeploy only the authservice container with env-file
            docker compose --env-file .env pull authservice
            docker compose --env-file .env up -d authservice

            # Show container status
            docker compose ps
